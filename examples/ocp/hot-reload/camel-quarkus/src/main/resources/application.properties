quarkus.kubernetes-config.secrets.enabled=true
quarkus.kubernetes-config.secrets=secret-basic-auth

quarkus.datasource.my-camel.db-kind=postgresql
quarkus.datasource.my-camel.username=${username}
quarkus.datasource.my-camel.password=${password}
quarkus.datasource.my-camel.jdbc.url=jdbc:postgresql://${host}:${port}/testdb

# quarkus kubernetes client
quarkus.kubernetes-client.trust-certs=true
quarkus.kubernetes-client.namespace=default
# kubernetes endpoint
quarkus.kubernetes-client.api-server-url=https://192.168.39.23:8443
# minikube k config view --minify shows the correct paths of your minikube
quarkus.kubernetes-client.client-cert-file=/home/claudio/.minikube/profiles/minikube/client.crt
quarkus.kubernetes-client.client-key-file=/home/claudio/.minikube/profiles/minikube/client.key

# quarkus.log.category."org.postgresql".level=TRACE
# quarkus.log.category."org.postgresql".min-level=TRACE
# quarkus.log.category."org.apache.camel.component.jdbc".level=TRACE
# quarkus.log.category."org.apache.camel.component.jdbc".min-level=TRACE
quarkus.log.category."org.apache.camel.component.kubernetes".level=TRACE
quarkus.log.category."org.apache.camel.component.kubernetes".min-level=TRACE
quarkus.log.category."org.apache.camel.main".level=TRACE
quarkus.log.category."org.apache.camel.main".min-level=TRACE
